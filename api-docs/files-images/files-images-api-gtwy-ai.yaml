openapi: 3.0.3
info:
  title: Files & Images
  version: 1.0.0
servers:
  - url: https://api.gtwy.ai
paths:
  /image/processing/:
    post:
      summary: Upload Image
      description: |-
        Uploads one image (or any file) to GTWY cloud storage and returns its public URL, for use in chat completion images/user_urls. Send multipart/form-data with the file in field 'image'. Limits: max 10 files per request and 35MB combined. Errors: 400 if the size limit is exceeded or the upload fails; 422 if the 'image' field is missing. The same router is also mounted at https://api.gtwy.ai/files (e.g. /files/... ) as an alias; no caller of the /files prefix was found, the dashboard uses /image/processing.

        Accepted auth: none (public).

        Body fields:
        - image: file, required (multipart). The image to upload.
      parameters:
        - name: Content-Type
          in: header
          required: false
          description: ""
          schema:
            type: string
          example: multipart/form-data
      requestBody:
        content:
          application/json:
            schema:
              type: object
            example:
              image: <binary file>
      responses:
        "200":
          description: Uploaded
          content:
            application/json:
              examples:
                Uploaded:
                  summary: Uploaded
                  value:
                    success: true
                    image_url: https://storage.googleapis.com/<bucket>/uploads/receipt.png
        "400":
          description: Upload failed / too large
          content:
            application/json:
              examples:
                Upload_failed_too_large:
                  summary: Upload failed / too large
                  value:
                    detail:
                      success: false
                      error: Combined file size must not exceed 35MB
        "422":
          description: Missing file
          content:
            application/json:
              examples:
                Missing_file:
                  summary: Missing file
                  value:
                    detail: Validation error
                    errors:
                      - type: missing
                        loc:
                          - body
                          - image
                        msg: Field required
      x-docstar-published: true
  /image/processing/multi:
    post:
      summary: Upload Multiple Images
      description: |-
        Uploads several images in one multipart request (repeat the 'image' field) and returns one result per file; a failure on one file does not fail the others. Limits: max 10 files per request and 35MB combined. Errors: 400 if more than 10 files or over 35MB combined; 422 if no 'image' field. The same router is also mounted at https://api.gtwy.ai/files (e.g. /files/... ) as an alias; no caller of the /files prefix was found, the dashboard uses /image/processing.

        Accepted auth: none (public).

        Body fields:
        - image: file, required, repeatable (multipart). Images to upload, max 10.
      parameters:
        - name: Content-Type
          in: header
          required: false
          description: ""
          schema:
            type: string
          example: multipart/form-data
      requestBody:
        content:
          application/json:
            schema:
              type: object
            example:
              image:
                - <binary file 1>
                - <binary file 2>
      responses:
        "200":
          description: Uploaded
          content:
            application/json:
              examples:
                Uploaded:
                  summary: Uploaded
                  value:
                    - success: true
                      image_url: https://storage.googleapis.com/<bucket>/uploads/a.png
                    - success: false
                      error: "Error in image processing: ..."
        "400":
          description: Too many files
          content:
            application/json:
              examples:
                Too_many_files:
                  summary: Too many files
                  value:
                    detail:
                      success: false
                      error: Only 10 files are allowed at a time
      x-docstar-published: true
  /image/processing/upload:
    post:
      summary: Upload File
      description: |-
        Uploads documents (PDF, images, text) or videos for use in agent conversations. Multipart: send files in 'file' and/or 'video' (repeatable); videos are uploaded to Google Gemini Files with the supplied Gemini apikey, other files go to GTWY storage. PDF URLs are cached per agent_id+thread_id(+sub_thread_id) for 7 days so the agent can read them on later turns. Alternatively send JSON (or form field) video_url + apikey to fetch a public video URL into Gemini (waits up to 5 minutes for processing). Office/archive/executable files (.docx, .xlsx, .pptx, .zip, .exe ...) are rejected. Limits: max 10 files per request and 35MB combined. Single-file responses keep a flat shape; multi-file responses return {success, results[]}. Errors: 400 for missing file, unsupported type, missing apikey for video, size/count limits or upload failure; 408 video processing timeout; 500 Gemini processing failed. The same router is also mounted at https://api.gtwy.ai/files (e.g. /files/... ) as an alias; no caller of the /files prefix was found, the dashboard uses /image/processing.

        Accepted auth: Authorization (dashboard user JWT) OR proxy_auth_token (proxy / auth 2.0 user token) OR pauthkey (org auth key).

        Body fields:
        - file: file, required unless video or video_url is sent (multipart, repeatable). Document/image to upload.
        - video: file, optional (multipart, repeatable). Video file; requires apikey.
        - apikey: string, required for videos/video_url. Google Gemini API key used to upload the video.
        - video_url: string (http/https URL ending in a video extension: .mp4 .mpeg .mpg .mov .avi .flv .webm .wmv .3gpp .3gp), optional. Send as JSON body or form field instead of a file.
        - agent_id: string, optional. With thread_id, uploaded PDF URLs are cached for this agent/thread.
        - thread_id: string, optional. Conversation the PDFs belong to.
        - sub_thread_id: string, optional. Defaults to thread_id for the cache key.
      parameters:
        - name: Authorization
          in: header
          required: false
          description: GTWY dashboard user JWT (the token GTWY issues at login, signed with the server SecretKey). Raw token, no 'Bearer' prefix.
          schema:
            type: string
        - name: proxy_auth_token
          in: header
          required: false
          description: Proxy (36Blocks / MSG91) user token, e.g. returned by the proxy auth 2.0 widget. Resolved via routes.msg91.com/api/c/getDetails; carries no user role or email.
          schema:
            type: string
        - name: pauthkey
          in: header
          required: false
          description: GTWY org auth key (pauthkey / pauthtoken) created in GTWY > API keys. Identifies the org; carries no user role.
          schema:
            type: string
        - name: Content-Type
          in: header
          required: false
          description: ""
          schema:
            type: string
          example: multipart/form-data
      requestBody:
        content:
          application/json:
            schema:
              type: object
            example:
              file: "<binary file: contract.pdf>"
              agent_id: 6650a1b2c3d4e5f6a7b8c9d0
              thread_id: customer-42
              sub_thread_id: customer-42
      responses:
        "200":
          description: File uploaded (single)
          content:
            application/json:
              examples:
                File_uploaded_single:
                  summary: File uploaded (single)
                  value:
                    success: true
                    file_url: https://storage.googleapis.com/<bucket>/uploads/contract.pdf
                Video_uploaded_single:
                  summary: Video uploaded (single)
                  value:
                    success: true
                    file_data:
                      name: files/abc123
                      mime_type: video/mp4
                      uri: https://generativelanguage.googleapis.com/v1beta/files/abc123
                      state: FileState.PROCESSING
                    message: Video uploaded to Gemini successfully
                Multiple_files:
                  summary: Multiple files
                  value:
                    success: false
                    results:
                      - success: true
                        filename: a.pdf
                        file_url: https://storage.googleapis.com/<bucket>/uploads/a.pdf
                      - success: false
                        filename: b.docx
                        error: "..."
        "400":
          description: No file
          content:
            application/json:
              examples:
                No_file:
                  summary: No file
                  value:
                    detail:
                      success: false
                      error: File or video_url not found
        "408":
          description: Video processing timeout
          content:
            application/json:
              examples:
                Video_processing_timeout:
                  summary: Video processing timeout
                  value:
                    detail:
                      success: false
                      error: "File processing timeout after 300 seconds. Current state: PROCESSING"
        "401":
          description: Unauthorized (bad/revoked token or invalid pauthkey)
          content:
            application/json:
              examples:
                Unauthorized_bad_revoked_token_or_invalid_pauthkey:
                  summary: Unauthorized (bad/revoked token or invalid pauthkey)
                  value:
                    detail: unauthorized user
        "403":
          description: Organization disabled
          content:
            application/json:
              examples:
                Organization_disabled:
                  summary: Organization disabled
                  value:
                    detail: Organization is disabled
        "404":
          description: No auth header sent
          content:
            application/json:
              examples:
                No_auth_header_sent:
                  summary: No auth header sent
                  value:
                    detail: unauthorized user
      x-docstar-published: true
