  /embed/login:
    post:
      summary: Embed Login
      description: |-
        Logs an end user of a customer's app into the GTWY embed (agent builder iframe). The customer signs a JWT with the org's gtwyAccessToken containing org_id, folder_id and user_id (or unique_identifier); GTWY creates or fetches the matching proxy user and returns a GTWY embed session token plus the embed folder's config and API key mapping. Token errors: 498 when missing, 401 when claims are missing or the org has no gtwyAccessToken, 401 on bad signature.

        Accepted auth: Authorization (GTWY embed JWT).
      parameters:
        - name: Authorization
          in: header
          required: false
          description: GTWY embed JWT signed by the customer with the org's gtwyAccessToken; payload org_id, folder_id, user_id.
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              examples:
                Success:
                  summary: Success
                  value:
                    data:
                      org_id: "12345"
                      folder_id: 6652cc11dd22ee33ff44aa55
                      user_id: "9876"
                      email: user@customer.com
                      name: Jane
                      meta:
                        type: embed
                      org_name: Acme
                      iat: 1730000000
                      token: <gtwy embed jwt>
                      config:
                        showHistory: false
                        themeMode: light
                        apikey_object_id:
                          openai: 665f1c2e9b1d4a0012ab34cd
                    message: logged in successfully
        "498":
          description: Missing Token
          content:
            application/json:
              examples:
                Missing_Token:
                  summary: Missing Token
                  value:
                    message: invalid token
        "401":
          description: Unauthorized
          content:
            application/json:
              examples:
                Unauthorized:
                  summary: Unauthorized
                  value:
                    message: unauthorized user, user_id (or unique_identifier), folder id or org id not provided
      x-docstar-published: true
