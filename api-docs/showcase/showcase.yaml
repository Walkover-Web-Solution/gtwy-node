openapi: 3.0.3
info:
  title: Showcase
  version: 1.0.0
servers:
  - url: https://db.gtwy.ai/api
paths:
  /showcase:
    post:
      summary: Submit Showcase
      description: |-
        Submits a project to the public GTWY showcase wall. Entries are saved as pending (status 0) and only appear in List Showcases after a maintainer approves them. Names must be unique; a duplicate name fails with 400 (database duplicate-key message).

        Accepted auth: none (public).

        Body fields:
        - category: string, required, 1-100 chars, category slug (e.g. x, github)
        - name: string, required, 2-150 chars, unique
        - description: string, required, 50-300 chars
        - link: string, required, http/https URL, max 500 chars
      parameters:
        - name: Content-Type
          in: header
          required: false
          description: ""
          schema:
            type: string
          example: application/json
      requestBody:
        content:
          application/json:
            schema:
              type: object
            example:
              category: github
              name: Acme Support Agent
              description: An open-source customer support agent built on GTWY that answers billing questions.
              link: https://github.com/acme/support-agent
      responses:
        "201":
          description: Created
          content:
            application/json:
              examples:
                Created:
                  summary: Created
                  value:
                    success: true
                    message: Showcase submitted successfully and is pending approval
                    data:
                      _id: 6650f1c2a1b2c3d4e5f60b01
                      category: github
                      name: Acme Support Agent
                      description: "..."
                      link: https://github.com/acme/support-agent
                      status: 0
                      createdAt: "2025-01-01T00:00:00.000Z"
                      updatedAt: "2025-01-01T00:00:00.000Z"
        "400":
          description: Validation error
          content:
            application/json:
              examples:
                Validation_error:
                  summary: Validation error
                  value:
                    message: description must be at least 50 characters
                    data: {}
      x-docstar-published: true
    get:
      summary: List Showcases
      description: |-
        Lists approved showcase entries, newest first, paginated.

        Accepted auth: none (public).
      parameters:
        - name: page
          in: query
          required: false
          description: integer, optional, default 1
          schema:
            type: string
          example: "1"
        - name: limit
          in: query
          required: false
          description: integer, optional, default 30, page size
          schema:
            type: string
          example: "30"
      responses:
        "200":
          description: Success
          content:
            application/json:
              examples:
                Success:
                  summary: Success
                  value:
                    success: true
                    message: Showcases retrieved successfully
                    data:
                      - _id: 6650f1c2a1b2c3d4e5f60b01
                        category: github
                        name: Acme Support Agent
                        description: "..."
                        link: https://github.com/acme/support-agent
                        status: 1
                    total: 1
                    page: 1
                    limit: 30
                    totalPages: 1
      x-docstar-published: true
