  /lago/provision:
    post:
      summary: Provision Org Webhook
      description: |-
        MSG91 signup webhook that provisions Lago billing for a newly created org: creates the Lago customer, a subscription on the default 'free' plan, and a credit wallet, each skipped if it already exists (idempotent; never downgrades an existing paid subscription). Only events 'create_company' and 'register_company_and_user' are handled; the org id is read from data.company.id. Unknown body keys are allowed. Errors: 403 invalid webhook token; 400 unsupported event, missing org id, or validation failure; Lago failures surface as 400 via the error handler.

        Accepted auth: none (public).

        Body fields:
        - event: string, required. Only 'create_company' or 'register_company_and_user' are processed; others return 400.
        - data: object, required, any shape. data.company.id (string|number) is the org id to provision.
        - *: Any additional keys are accepted and ignored.
      parameters:
        - name: x-webhook-token
          in: header
          required: false
          description: Shared secret; required only when LAGO_PROVISION_WEBHOOK_TOKEN is configured.
          schema:
            type: string
        - name: Content-Type
          in: header
          required: false
          description: JSON request body
          schema:
            type: string
          example: application/json
      requestBody:
        content:
          application/json:
            schema:
              type: object
            example:
              event: create_company
              data:
                company:
                  id: 12345
                  name: Acme Inc
      responses:
        "200":
          description: Success
          content:
            application/json:
              examples:
                Success:
                  summary: Success
                  value:
                    success: true
                    message: Customer, subscription and wallet provisioned
                    data:
                      customer:
                        skipped: true
                        reason: customer already exists
                      subscription:
                        skipped: true
                        reason: subscription already exists
                        plan_code: gtwy_free
                        plan_slug: free
                      wallet:
                        skipped: true
                        reason: active wallet already exists
                      plan: free
        "403":
          description: Invalid webhook token
          content:
            application/json:
              examples:
                Invalid_webhook_token:
                  summary: Invalid webhook token
                  value:
                    success: false
                    message: invalid webhook token
        "400":
          description: Unsupported event
          content:
            application/json:
              examples:
                Unsupported_event:
                  summary: Unsupported event
                  value:
                    success: false
                    message: unsupported event
