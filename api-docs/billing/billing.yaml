openapi: 3.0.3
info:
  title: Billing
  version: 1.0.0
servers:
  - url: https://db.gtwy.ai/api
paths:
  /lago/provision/admin:
    post:
      summary: Provision Org (Admin)
      description: |-
        Manually provisions Lago billing for one org: ensures a Lago customer, a subscription (default 'free' plan) and a credit wallet exist, skipping any that already exist. Idempotent and safe to re-run; it never re-posts a plan over an existing subscription. Internal operators only. Errors: 401 bad credentials, 403 not allowlisted, 400 missing org_id or a Lago API failure.

        Accepted auth: Authorization (dashboard user JWT).

        Internal only: the caller's email must be in INTERNAL_ALLOWED_EMAILS, so only a dashboard user JWT works (pauthkey / proxy_auth_token carry no email -> 403).

        Body fields:
        - org_id: string or number, required. Org to provision.
      parameters:
        - name: Authorization
          in: header
          required: false
          description: GTWY dashboard user JWT (the token GTWY issues at login, signed with the server SecretKey). Raw token, no 'Bearer' prefix.
          schema:
            type: string
        - name: Content-Type
          in: header
          required: false
          description: JSON request body
          schema:
            type: string
          example: application/json
      requestBody:
        content:
          application/json:
            schema:
              type: object
            example:
              org_id: "12345"
      responses:
        "200":
          description: Success
          content:
            application/json:
              examples:
                Success:
                  summary: Success
                  value:
                    success: true
                    message: Customer, subscription and wallet provisioned
                    data:
                      customer:
                        lago_id: "..."
                        external_id: "12345"
                      subscription:
                        external_id: "12345"
                        plan_code: gtwy_free
                      wallet:
                        lago_id: "..."
                        credits_balance: "100.0"
                      plan: free
        "400":
          description: Validation error
          content:
            application/json:
              examples:
                Validation_error:
                  summary: Validation error
                  value:
                    message: org_id not found
                    data: {}
        "401":
          description: Unauthorized
          content:
            application/json:
              examples:
                Unauthorized:
                  summary: Unauthorized
                  value:
                    message: unauthorized user
        "403":
          description: Forbidden (not an internal operator)
          content:
            application/json:
              examples:
                Forbidden_not_an_internal_operator:
                  summary: Forbidden (not an internal operator)
                  value:
                    success: false
                    message: "Access denied: you are not authorized for this action"
      x-docstar-published: true
  /lago/wallet:
    get:
      summary: Get My Wallet Balance
      description: |-
        Returns the credit wallet of the caller's own org (org taken from the token, never the URL). Served from a 60-second Redis cache, falling back to Lago on a miss. Credit figures are summed across all active wallets of the org. data is null with message 'no wallet provisioned yet' when the org has no wallet. Errors: 401 bad credentials; 403 if the org cannot be resolved from the token.

        Accepted auth: Authorization (dashboard user JWT) OR pauthkey (org auth key) OR proxy_auth_token (proxy / auth 2.0 user token).
      parameters:
        - name: Authorization
          in: header
          required: false
          description: GTWY dashboard user JWT (the token GTWY issues at login, signed with the server SecretKey). Raw token, no 'Bearer' prefix.
          schema:
            type: string
        - name: pauthkey
          in: header
          required: false
          description: GTWY org auth key (pauthkey / pauthtoken) created in GTWY > API keys. Identifies the org; carries no user role.
          schema:
            type: string
        - name: proxy_auth_token
          in: header
          required: false
          description: Proxy (36Blocks / MSG91) user token, e.g. returned by the proxy auth 2.0 widget. Resolved via routes.msg91.com/api/c/getDetails; carries no user role or email.
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              examples:
                Success:
                  summary: Success
                  value:
                    success: true
                    message: wallet found
                    data:
                      credits_balance: "2440.0"
                      balance_cents: 2440
                      currency: USD
                      rate_amount: "0.01"
                      ongoing_balance_cents: 2200
                      expiration_at: null
                      credits_ongoing_balance: "2200.0"
                      credits_ongoing_usage_balance: "240.0"
                      active_wallet_count: 1
                      wallet_ids:
                        - lago-wallet-uuid
                No_wallet:
                  summary: No wallet
                  value:
                    success: true
                    message: no wallet provisioned yet
                    data: null
        "401":
          description: Unauthorized
          content:
            application/json:
              examples:
                Unauthorized:
                  summary: Unauthorized
                  value:
                    message: unauthorized user
        "403":
          description: Org not resolved
          content:
            application/json:
              examples:
                Org_not_resolved:
                  summary: Org not resolved
                  value:
                    success: false
                    message: org not resolved from token
      x-docstar-published: true
  /lago/wallet/topup:
    post:
      summary: Top Up Org Wallet
      description: |-
        Credits a number of credits to any org's Lago wallet and resyncs the Redis shadow balance used by the request gate. If reference_id is given and was already applied, nothing is added and duplicate=true is returned (idempotent retries). Internal operators only. Errors: 400 validation (org_id/credits missing, credits not > 0) or Lago failure; 401; 403.

        Accepted auth: Authorization (dashboard user JWT).

        Internal only: the caller's email must be in INTERNAL_ALLOWED_EMAILS, so only a dashboard user JWT works (pauthkey / proxy_auth_token carry no email -> 403).

        Body fields:
        - org_id: string or number, required. Target org.
        - credits: number, required, > 0. Credits to add.
        - reference_id: string, optional. Idempotency key; a repeat with the same value adds nothing.
        - metadata: object, optional. Extra key/values stored on the Lago wallet transaction.
      parameters:
        - name: Authorization
          in: header
          required: false
          description: GTWY dashboard user JWT (the token GTWY issues at login, signed with the server SecretKey). Raw token, no 'Bearer' prefix.
          schema:
            type: string
        - name: Content-Type
          in: header
          required: false
          description: JSON request body
          schema:
            type: string
          example: application/json
      requestBody:
        content:
          application/json:
            schema:
              type: object
            example:
              org_id: "12345"
              credits: 500
              reference_id: topup-2026-10-23-001
              metadata:
                note: manual top-up
      responses:
        "200":
          description: Success
          content:
            application/json:
              examples:
                Success:
                  summary: Success
                  value:
                    success: true
                    message: wallet topped up successfully
                    data:
                      org_id: "12345"
                      credits_added: "500"
                      credits_balance: "2940.0"
                      duplicate: false
                      transaction:
                        lago_id: "..."
                Duplicate_reference:
                  summary: Duplicate reference
                  value:
                    success: true
                    message: top-up already applied for this reference_id
                    data:
                      org_id: "12345"
                      credits_added: "0"
                      credits_balance: "2940.0"
                      duplicate: true
                      transaction: null
        "400":
          description: Validation error
          content:
            application/json:
              examples:
                Validation_error:
                  summary: Validation error
                  value:
                    message: credits must be greater than 0
                    data: {}
        "401":
          description: Unauthorized
          content:
            application/json:
              examples:
                Unauthorized:
                  summary: Unauthorized
                  value:
                    message: unauthorized user
        "403":
          description: Forbidden (not an internal operator)
          content:
            application/json:
              examples:
                Forbidden_not_an_internal_operator:
                  summary: Forbidden (not an internal operator)
                  value:
                    success: false
                    message: "Access denied: you are not authorized for this action"
      x-docstar-published: true
  /lago/debits/replay:
    post:
      summary: Replay Failed Debits
      description: |-
        Re-posts usage debits that previously failed against Lago (oldest first, from the failed_billing_debits collection). Each successful re-post is marked replayed; failures increment attempts and keep the error. The body is not validated; limit defaults to 100 and is capped at 500. Internal operators only.

        Accepted auth: Authorization (dashboard user JWT).

        Internal only: the caller's email must be in INTERNAL_ALLOWED_EMAILS, so only a dashboard user JWT works (pauthkey / proxy_auth_token carry no email -> 403).

        Body fields:
        - limit: number, optional (default 100, max 500). How many failed debits to retry.
      parameters:
        - name: Authorization
          in: header
          required: false
          description: GTWY dashboard user JWT (the token GTWY issues at login, signed with the server SecretKey). Raw token, no 'Bearer' prefix.
          schema:
            type: string
        - name: Content-Type
          in: header
          required: false
          description: JSON request body
          schema:
            type: string
          example: application/json
      requestBody:
        content:
          application/json:
            schema:
              type: object
            example:
              limit: 100
      responses:
        "200":
          description: Success
          content:
            application/json:
              examples:
                Success:
                  summary: Success
                  value:
                    success: true
                    message: replay finished
                    data:
                      replayed: 12
                      failed: 1
                      skipped_ambiguous: 0
        "401":
          description: Unauthorized
          content:
            application/json:
              examples:
                Unauthorized:
                  summary: Unauthorized
                  value:
                    message: unauthorized user
        "403":
          description: Forbidden (not an internal operator)
          content:
            application/json:
              examples:
                Forbidden_not_an_internal_operator:
                  summary: Forbidden (not an internal operator)
                  value:
                    success: false
                    message: "Access denied: you are not authorized for this action"
      x-docstar-published: true
  /lago/plan:
    post:
      summary: Set Org Plan
      description: |-
        Moves an org between billing plans in Lago (the only admin route that does so), bypassing the self-serve Stripe flow, e.g. for comped orgs or support fixes. Updates the Redis plan cache and also resets the org's billing status record (paid -> status active; free -> status none). The caller's email and reason are logged. Errors: 400 invalid plan slug, org has no active Lago subscription (provision first), a plan change already in progress, or Lago did not activate the plan; 401; 403.

        Accepted auth: Authorization (dashboard user JWT).

        Internal only: the caller's email must be in INTERNAL_ALLOWED_EMAILS, so only a dashboard user JWT works (pauthkey / proxy_auth_token carry no email -> 403).

        Body fields:
        - org_id: string or number, required. Target org.
        - plan: string, required. Plan slug: 'free' or 'paid'.
        - reason: string, optional, max 500 chars. Audit note.
      parameters:
        - name: Authorization
          in: header
          required: false
          description: GTWY dashboard user JWT (the token GTWY issues at login, signed with the server SecretKey). Raw token, no 'Bearer' prefix.
          schema:
            type: string
        - name: Content-Type
          in: header
          required: false
          description: JSON request body
          schema:
            type: string
          example: application/json
      requestBody:
        content:
          application/json:
            schema:
              type: object
            example:
              org_id: "12345"
              plan: paid
              reason: comped for partner pilot
      responses:
        "200":
          description: Success
          content:
            application/json:
              examples:
                Success:
                  summary: Success
                  value:
                    success: true
                    message: org moved to 'paid'
                    data:
                      org_id: "12345"
                      changed: true
                      deferred: false
                      plan: paid
                      previous_plan: free
                      plan_code: gtwy_paid
                Already_on_plan:
                  summary: Already on plan
                  value:
                    success: true
                    message: org already on 'paid'
                    data:
                      org_id: "12345"
                      changed: false
                      deferred: false
                      plan: paid
                      previous_plan: paid
                      plan_code: gtwy_paid
        "400":
          description: Validation error
          content:
            application/json:
              examples:
                Validation_error:
                  summary: Validation error
                  value:
                    message: plan must be one of free, paid
                    data: {}
        "401":
          description: Unauthorized
          content:
            application/json:
              examples:
                Unauthorized:
                  summary: Unauthorized
                  value:
                    message: unauthorized user
        "403":
          description: Forbidden (not an internal operator)
          content:
            application/json:
              examples:
                Forbidden_not_an_internal_operator:
                  summary: Forbidden (not an internal operator)
                  value:
                    success: false
                    message: "Access denied: you are not authorized for this action"
      x-docstar-published: true
  /lago/plan/org/me:
    get:
      summary: Get My Plan
      description: |-
        Returns the caller's own org plan as Lago enforces it, plus its display label and the allowed services/models from the billing plan definition. Falls back to 'free' if Lago cannot be reached or the org has no subscription; services is '*' when the plan has no definition. Errors: 401.

        Accepted auth: Authorization (dashboard user JWT) OR pauthkey (org auth key) OR proxy_auth_token (proxy / auth 2.0 user token).
      parameters:
        - name: Authorization
          in: header
          required: false
          description: GTWY dashboard user JWT (the token GTWY issues at login, signed with the server SecretKey). Raw token, no 'Bearer' prefix.
          schema:
            type: string
        - name: pauthkey
          in: header
          required: false
          description: GTWY org auth key (pauthkey / pauthtoken) created in GTWY > API keys. Identifies the org; carries no user role.
          schema:
            type: string
        - name: proxy_auth_token
          in: header
          required: false
          description: Proxy (36Blocks / MSG91) user token, e.g. returned by the proxy auth 2.0 widget. Resolved via routes.msg91.com/api/c/getDetails; carries no user role or email.
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              examples:
                Success:
                  summary: Success
                  value:
                    success: true
                    data:
                      plan: paid
                      label: Pro
                      services: "*"
        "401":
          description: Unauthorized
          content:
            application/json:
              examples:
                Unauthorized:
                  summary: Unauthorized
                  value:
                    message: unauthorized user
      x-docstar-published: true
  /lago/plan/{org_id}:
    get:
      summary: Check Org Plan Drift
      description: |-
        Read-only drift check comparing an org's plan in Lago with the plan cached in Redis. drift is true only when a Redis value exists and differs from Lago. Internal operators only. Errors: 401; 403.

        Accepted auth: Authorization (dashboard user JWT).

        Internal only: the caller's email must be in INTERNAL_ALLOWED_EMAILS, so only a dashboard user JWT works (pauthkey / proxy_auth_token carry no email -> 403).
      parameters:
        - name: org_id
          in: path
          required: true
          description: string, required. Org to check.
          schema:
            type: string
        - name: Authorization
          in: header
          required: false
          description: GTWY dashboard user JWT (the token GTWY issues at login, signed with the server SecretKey). Raw token, no 'Bearer' prefix.
          schema:
            type: string
      responses:
        "200":
          description: In sync
          content:
            application/json:
              examples:
                In_sync:
                  summary: In sync
                  value:
                    success: true
                    message: in sync
                    data:
                      org_id: "12345"
                      lago_plan_code: gtwy_paid
                      lago_plan: paid
                      redis_plan: paid
                      pending: null
                      drift: false
                Drift:
                  summary: Drift
                  value:
                    success: true
                    message: PLAN DRIFT — Lago and Redis disagree
                    data:
                      org_id: "12345"
                      lago_plan_code: gtwy_paid
                      lago_plan: paid
                      redis_plan: free
                      pending: null
                      drift: true
        "401":
          description: Unauthorized
          content:
            application/json:
              examples:
                Unauthorized:
                  summary: Unauthorized
                  value:
                    message: unauthorized user
        "403":
          description: Forbidden (not an internal operator)
          content:
            application/json:
              examples:
                Forbidden_not_an_internal_operator:
                  summary: Forbidden (not an internal operator)
                  value:
                    success: false
                    message: "Access denied: you are not authorized for this action"
      x-docstar-published: true
  /lago/webhook:
    post:
      summary: Lago Webhook
      description: |-
        Receives Lago billing webhooks. The raw body (max 1 MB) is signature-verified, parsed, recorded once per X-Lago-Unique-Key, and dispatched: invoice.payment_status_updated, invoice.payment_failure, payment.requires_action, customer.payment_provider_created, customer.payment_provider_error, subscription.started and subscription.terminated are handled (grant credits, mark past_due/downgrade, record card/3DS state); other types are recorded or ignored. Responds directly, not via the standard envelope. 200 = processed, ignored, duplicate, in progress, or permanent failure; 500 = transient failure (Lago retries); 400 = bad/missing signature, non-HMAC algorithm, unparseable body, or missing X-Lago-Unique-Key; 503 = billing disabled on this environment.

        Accepted auth: none (public).

        Body fields:
        - webhook_type: string. Lago event type.
        - object_type: string. Name of the key that holds the payload object (e.g. invoice, subscription, customer).
        - <object_type>: object. The Lago object; a flat 'object' key is also accepted.
      parameters:
        - name: X-Lago-Signature
          in: header
          required: false
          description: Required. base64 HMAC-SHA256 of the raw request body.
          schema:
            type: string
        - name: X-Lago-Signature-Algorithm
          in: header
          required: false
          description: Optional; defaults to hmac. Any other value is rejected with 400.
          schema:
            type: string
          example: hmac
        - name: X-Lago-Unique-Key
          in: header
          required: false
          description: Required. Lago's unique webhook id, used for idempotency.
          schema:
            type: string
        - name: Content-Type
          in: header
          required: false
          description: JSON request body
          schema:
            type: string
          example: application/json
      requestBody:
        content:
          application/json:
            schema:
              type: object
            example:
              webhook_type: invoice.payment_status_updated
              object_type: invoice
              invoice:
                lago_id: lago-invoice-uuid
                invoice_type: subscription
                payment_status: succeeded
                customer:
                  external_id: "12345"
      responses:
        "200":
          description: Processed
          content:
            application/json:
              examples:
                Processed:
                  summary: Processed
                  value:
                    received: true
                    status: processed
                Duplicate:
                  summary: Duplicate
                  value:
                    received: true
                    status: duplicate
        "500":
          description: Transient failure
          content:
            application/json:
              examples:
                Transient_failure:
                  summary: Transient failure
                  value:
                    received: true
                    status: failed
        "400":
          description: Bad signature
          content:
            application/json:
              examples:
                Bad_signature:
                  summary: Bad signature
                  value:
                    received: false
                Missing_unique_key:
                  summary: Missing unique key
                  value:
                    received: false
                    message: missing X-Lago-Unique-Key
        "503":
          description: Billing disabled
          content:
            application/json:
              examples:
                Billing_disabled:
                  summary: Billing disabled
                  value:
                    received: false
                    message: billing disabled
      x-docstar-published: true
  /billing-plans/org/public:
    get:
      summary: List Public Billing Plans
      description: |-
        Lists active billing plans (status 1) with only end-user-safe fields: plan_code, display_name, credit_grant, monthly_credits, credit_packs, plus the price taken from the Lago plan. The internal model allowlist (services) and hit fees are not included. price is null if Lago cannot be reached or the plan code is unknown. For the plans/pricing page. Errors: 401.

        Accepted auth: Authorization (dashboard user JWT) OR pauthkey (org auth key) OR proxy_auth_token (proxy / auth 2.0 user token).
      parameters:
        - name: Authorization
          in: header
          required: false
          description: GTWY dashboard user JWT (the token GTWY issues at login, signed with the server SecretKey). Raw token, no 'Bearer' prefix.
          schema:
            type: string
        - name: pauthkey
          in: header
          required: false
          description: GTWY org auth key (pauthkey / pauthtoken) created in GTWY > API keys. Identifies the org; carries no user role.
          schema:
            type: string
        - name: proxy_auth_token
          in: header
          required: false
          description: Proxy (36Blocks / MSG91) user token, e.g. returned by the proxy auth 2.0 widget. Resolved via routes.msg91.com/api/c/getDetails; carries no user role or email.
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              examples:
                Success:
                  summary: Success
                  value:
                    success: true
                    data:
                      - _id: "..."
                        plan_code: free
                        display_name: Free
                        credit_grant: 100
                        monthly_credits: 0
                        price:
                          amount_cents: 0
                          currency: USD
                          interval: monthly
                      - _id: "..."
                        plan_code: paid
                        display_name: Pro
                        credit_grant: 0
                        monthly_credits: 8000
                        credit_packs:
                          - 10
                          - 20
                          - 50
                        price:
                          amount_cents: 2000
                          currency: USD
                          interval: monthly
        "401":
          description: Unauthorized
          content:
            application/json:
              examples:
                Unauthorized:
                  summary: Unauthorized
                  value:
                    message: unauthorized user
      x-docstar-published: true
  /billing-plans:
    put:
      summary: Create Or Update Billing Plan
      description: |-
        Upserts the definition of a billing plan (what it includes): allowed services/models, signup grant, monthly credits, per-hit fees and credit packs. gtwy-ai reads this collection live, so changes apply without a deploy. Sending hit_fees or credit_packs replaces the stored value; omitting monthly_credits, hit_fees or credit_packs leaves them unchanged. Moving an org between plans is POST /api/lago/plan, not this route. Errors: 400 validation (plan_code not free/paid, bad services shape, fee > $10, pack > $1000 or repeated, more than 10 packs); 401; 403.

        Accepted auth: Authorization (dashboard user JWT).

        Internal only: the caller's email must be in INTERNAL_ALLOWED_EMAILS, so only a dashboard user JWT works (pauthkey / proxy_auth_token carry no email -> 403).

        Body fields:
        - plan_code: string, required. 'free' or 'paid' only.
        - display_name: string, required, non-empty. Name shown to users.
        - services: required. '*' (everything) or an object mapping a service name to '*' or a non-empty array of model names.
        - credit_grant: number, optional (default 0), >= 0. Credits granted on signup/wallet creation.
        - status: number, optional (default 1). 1 active, 0 inactive.
        - monthly_credits: integer, optional, >= 0. Balance a paid subscription invoice tops the wallet up to.
        - hit_fees: object, optional. Per-hit USD fees: api, chatbot, embed (each 0-10, default 0). Replaces stored map.
        - credit_packs: array of numbers, optional. USD pack amounts (each > 0 and <= 1000, unique, max 10). Replaces stored list; [] offers no packs.
      parameters:
        - name: Authorization
          in: header
          required: false
          description: GTWY dashboard user JWT (the token GTWY issues at login, signed with the server SecretKey). Raw token, no 'Bearer' prefix.
          schema:
            type: string
        - name: Content-Type
          in: header
          required: false
          description: JSON request body
          schema:
            type: string
          example: application/json
      requestBody:
        content:
          application/json:
            schema:
              type: object
            example:
              plan_code: paid
              display_name: Pro
              services:
                openai:
                  - gpt-4o
                  - gpt-4o-mini
                anthropic: "*"
              credit_grant: 0
              status: 1
              monthly_credits: 8000
              hit_fees:
                api: 0
                chatbot: 0.001
                embed: 0
              credit_packs:
                - 10
                - 20
                - 50
                - 100
      responses:
        "200":
          description: Success
          content:
            application/json:
              examples:
                Success:
                  summary: Success
                  value:
                    success: true
                    message: billing plan saved
                    data:
                      _id: "..."
                      plan_code: paid
                      display_name: Pro
                      services:
                        openai:
                          - gpt-4o
                          - gpt-4o-mini
                        anthropic: "*"
                      credit_grant: 0
                      monthly_credits: 8000
                      hit_fees:
                        api: 0
                        chatbot: 0.001
                        embed: 0
                      credit_packs:
                        - 10
                        - 20
                        - 50
                      status: 1
                      updated_by: ops@gtwy.ai
                      created_at: "2026-01-01T00:00:00.000Z"
                      updated_at: "2026-10-01T00:00:00.000Z"
        "400":
          description: Validation error
          content:
            application/json:
              examples:
                Validation_error:
                  summary: Validation error
                  value:
                    message: plan_code must be "free" or "paid" — adding a plan requires a coordinated Python release first
                    data: {}
        "401":
          description: Unauthorized
          content:
            application/json:
              examples:
                Unauthorized:
                  summary: Unauthorized
                  value:
                    message: unauthorized user
        "403":
          description: Forbidden (not an internal operator)
          content:
            application/json:
              examples:
                Forbidden_not_an_internal_operator:
                  summary: Forbidden (not an internal operator)
