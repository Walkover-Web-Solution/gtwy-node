    get:
      summary: Preview Billing Reconcile
      description: |-
        Runs the billing reconcile job: credits paid subscription/credit-pack invoices never processed, retries open invoices of orgs in grace, downgrades orgs whose grace expired, settles stuck first payments, voids abandoned pack invoices, fixes Lago-vs-Redis plan drift and replays retryable failed events. This GET always forces a dry run (reports what would change, changes nothing) with the default 45-day lookback. Internal operators only. Errors: 401; 403; 503 billing disabled; 502 Lago error.

        Accepted auth: Authorization (dashboard user JWT).

        Internal only: the caller's email must be in INTERNAL_ALLOWED_EMAILS, so only a dashboard user JWT works (pauthkey / proxy_auth_token carry no email -> 403).
      parameters:
        - name: Authorization
          in: header
          required: false
          description: GTWY dashboard user JWT (the token GTWY issues at login, signed with the server SecretKey). Raw token, no 'Bearer' prefix.
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              examples:
                Success:
                  summary: Success
                  value:
                    success: true
                    message: dry run — nothing changed
                    data:
                      dry_run: true
                      checked: 42
                      credited:
                        - org_id: "12345"
                          invoice: lago-invoice-uuid
                          number: INV-0001
                      retried: []
                      downgraded: []
                      voided: []
                      cache_fixed: []
                      replayed: 0
                      errors: []
        "401":
          description: Unauthorized
