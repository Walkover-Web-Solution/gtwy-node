openapi: 3.0.3
info:
  title: Users & Session
  version: 1.0.0
servers:
  - url: https://db.gtwy.ai/api
paths:
  /user/localToken:
    post:
      summary: Create Local Token
      description: |-
        Exchanges the user's proxy (MSG91) login token for a GTWY session JWT (the 'local token' used in the Authorization header for other GTWY APIs). The token is generated by the proxy service for the user's current company. If proxy_auth_token is missing or invalid the proxy call fails and the error is returned as 400 {message, data}.

        Accepted auth: proxy_auth_token (proxy / auth 2.0 user token).
      parameters:
        - name: proxy_auth_token
          in: header
          required: false
          description: Proxy (36Blocks / MSG91) user token, e.g. returned by the proxy auth 2.0 widget. Resolved via routes.msg91.com/api/c/getDetails; carries no user role or email.
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              examples:
                Success:
                  summary: Success
                  value:
                    data:
                      token: <jwt>
                    success: true
        "400":
          description: Invalid Proxy Token
          content:
            application/json:
              examples:
                Invalid_Proxy_Token:
                  summary: Invalid Proxy Token
                  value:
                    message: Request failed with status code 401
                    data: {}
      x-docstar-published: true
  /user/switchOrg:
    post:
      summary: Switch Organization
      description: |-
        Issues a new GTWY session JWT after the user has switched their current company in the proxy service (the frontend first switches the company on MSG91, then calls this). The token is generated from the proxy_auth_token header (falls back to Authorization). If an Authorization token was sent it is blacklisted. orgId is validated but not otherwise used by the controller.

        Accepted auth: Authorization (dashboard user JWT) OR pauthkey (org auth key) OR proxy_auth_token (proxy / auth 2.0 user token).

        Body fields:
        - orgId: string|integer, required, org being switched to
        - orgName: string, optional
      parameters:
        - name: Authorization
          in: header
          required: false
          description: GTWY dashboard user JWT (the token GTWY issues at login, signed with the server SecretKey). Raw token, no 'Bearer' prefix.
          schema:
            type: string
        - name: pauthkey
          in: header
          required: false
          description: GTWY org auth key (pauthkey / pauthtoken) created in GTWY > API keys. Identifies the org; carries no user role.
          schema:
            type: string
        - name: proxy_auth_token
          in: header
          required: false
          description: Proxy (36Blocks / MSG91) user token, e.g. returned by the proxy auth 2.0 widget. Resolved via routes.msg91.com/api/c/getDetails; carries no user role or email.
          schema:
            type: string
        - name: Content-Type
          in: header
          required: false
          description: ""
          schema:
            type: string
          example: application/json
      requestBody:
        content:
          application/json:
            schema:
              type: object
            example:
              orgId: "12345"
              orgName: Acme
      responses:
        "200":
          description: Success
          content:
            application/json:
              examples:
                Success:
                  summary: Success
                  value:
                    data:
                      token: <jwt>
                    success: true
        "400":
          description: Validation Error
          content:
            application/json:
              examples:
                Validation_Error:
                  summary: Validation Error
                  value:
                    message: orgId is required
                    data: {}
        "401":
          description: Unauthorized
          content:
            application/json:
              examples:
                Unauthorized:
                  summary: Unauthorized
                  value:
                    message: unauthorized user
      x-docstar-published: true
  /user/updateDetails:
    put:
      summary: Update User Or Company Meta
      description: |-
        Updates the meta object of a company (send company_id + company) or of a user (send user_id + user) in the proxy service using GTWY's admin key, and refreshes the cached copy. Only the meta sub-object is forwarded. company_id and company (or user_id and user) must be sent together. Note: the ids are not checked against the caller's org or identity.

        Accepted auth: Authorization (dashboard user JWT) OR pauthkey (org auth key) OR proxy_auth_token (proxy / auth 2.0 user token).

        Body fields:
        - company_id: string|integer, required with company (for a company update)
        - company: object, required with company_id; only company.meta is applied
        - user_id: string|integer, required with user (for a user update)
        - user: object, required with user_id; only user.meta is applied
      parameters:
        - name: Authorization
          in: header
          required: false
          description: GTWY dashboard user JWT (the token GTWY issues at login, signed with the server SecretKey). Raw token, no 'Bearer' prefix.
          schema:
            type: string
        - name: pauthkey
          in: header
          required: false
          description: GTWY org auth key (pauthkey / pauthtoken) created in GTWY > API keys. Identifies the org; carries no user role.
          schema:
            type: string
        - name: proxy_auth_token
          in: header
          required: false
          description: Proxy (36Blocks / MSG91) user token, e.g. returned by the proxy auth 2.0 widget. Resolved via routes.msg91.com/api/c/getDetails; carries no user role or email.
          schema:
            type: string
        - name: Content-Type
          in: header
          required: false
          description: ""
          schema:
            type: string
          example: application/json
      requestBody:
        content:
          application/json:
            schema:
              type: object
            example:
              company_id: "12345"
              company:
                meta:
                  onboarding_done: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              examples:
                Success:
                  summary: Success
                  value:
                    message: Company details updated successfully
                    data:
                      data:
                        company:
                          id: 12345
                          meta:
                            onboarding_done: true
                    success: true
        "400":
          description: Validation Error
          content:
            application/json:
              examples:
                Validation_Error:
                  summary: Validation Error
                  value:
                    message: Either company_id or user_id is required
                    data: {}
        "401":
          description: Unauthorized
          content:
            application/json:
              examples:
                Unauthorized:
                  summary: Unauthorized
                  value:
                    message: unauthorized user
      x-docstar-published: true
  /user/deleteUser:
    delete:
      summary: Remove User From Organization
      description: |-
        Removes a user from the caller's organization in the proxy service. The org owner (first user returned by the proxy) cannot be removed (400 'You cannot remove the owner of the organization'). Note: no role check is applied beyond authentication.

        Accepted auth: Authorization (dashboard user JWT) OR pauthkey (org auth key) OR proxy_auth_token (proxy / auth 2.0 user token).

        Body fields:
        - user_id: string|integer, required, proxy user id to remove
      parameters:
        - name: Authorization
          in: header
          required: false
          description: GTWY dashboard user JWT (the token GTWY issues at login, signed with the server SecretKey). Raw token, no 'Bearer' prefix.
          schema:
            type: string
        - name: pauthkey
          in: header
          required: false
          description: GTWY org auth key (pauthkey / pauthtoken) created in GTWY > API keys. Identifies the org; carries no user role.
          schema:
            type: string
        - name: proxy_auth_token
          in: header
          required: false
          description: Proxy (36Blocks / MSG91) user token, e.g. returned by the proxy auth 2.0 widget. Resolved via routes.msg91.com/api/c/getDetails; carries no user role or email.
          schema:
            type: string
        - name: Content-Type
          in: header
          required: false
          description: ""
          schema:
            type: string
          example: application/json
      requestBody:
        content:
          application/json:
            schema:
              type: object
            example:
              user_id: "9876"
      responses:
        "200":
          description: Success
          content:
            application/json:
              examples:
                Success:
                  summary: Success
                  value:
                    data: User removed successfully
                    success: true
        "400":
          description: Owner
          content:
            application/json:
              examples:
                Owner:
                  summary: Owner
                  value:
                    message: You cannot remove the owner of the organization
                    data: {}
        "401":
          description: Unauthorized
          content:
            application/json:
              examples:
                Unauthorized:
                  summary: Unauthorized
                  value:
                    message: unauthorized user
      x-docstar-published: true
  /user/logout:
    post:
      summary: Logout
      description: |-
        Logs out by blacklisting the Authorization token until its expiry, so later requests with it get 401 'token revoked'. Returns 400 'No token provided' if called without an Authorization header (e.g. with pauthkey) and 500 'Logout failed' on cache errors.

        Accepted auth: Authorization (dashboard user JWT) OR pauthkey (org auth key) OR proxy_auth_token (proxy / auth 2.0 user token).
      parameters:
        - name: Authorization
          in: header
          required: false
          description: GTWY dashboard user JWT (the token GTWY issues at login, signed with the server SecretKey). Raw token, no 'Bearer' prefix.
          schema:
            type: string
        - name: pauthkey
          in: header
          required: false
          description: GTWY org auth key (pauthkey / pauthtoken) created in GTWY > API keys. Identifies the org; carries no user role.
          schema:
            type: string
        - name: proxy_auth_token
          in: header
          required: false
          description: Proxy (36Blocks / MSG91) user token, e.g. returned by the proxy auth 2.0 widget. Resolved via routes.msg91.com/api/c/getDetails; carries no user role or email.
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              examples:
                Success:
                  summary: Success
                  value:
                    success: true
                    message: Logged out successfully
        "400":
          description: No Token
          content:
            application/json:
              examples:
                No_Token:
                  summary: No Token
                  value:
                    success: false
                    message: No token provided
        "401":
          description: Unauthorized
          content:
            application/json:
              examples:
                Unauthorized:
                  summary: Unauthorized
                  value:
                    message: unauthorized user
      x-docstar-published: true
  /utils/users-details:
    get:
      summary: List Org Users
      description: |-
        Returns all users of the caller's organisation (fetched page by page from the proxy/MSG91 user service) reduced to user_id, name and email. 400 if the org id cannot be resolved from the auth.

        Accepted auth: Authorization (dashboard user JWT) OR pauthkey (org auth key) OR proxy_auth_token (proxy / auth 2.0 user token).
      parameters:
        - name: Authorization
          in: header
          required: false
          description: GTWY dashboard user JWT (the token GTWY issues at login, signed with the server SecretKey). Raw token, no 'Bearer' prefix.
          schema:
            type: string
        - name: pauthkey
          in: header
          required: false
          description: GTWY org auth key (pauthkey / pauthtoken) created in GTWY > API keys. Identifies the org; carries no user role.
          schema:
            type: string
        - name: proxy_auth_token
          in: header
          required: false
          description: Proxy (36Blocks / MSG91) user token, e.g. returned by the proxy auth 2.0 widget. Resolved via routes.msg91.com/api/c/getDetails; carries no user role or email.
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              examples:
                Success:
                  summary: Success
                  value:
                    data:
                      - user_id: 101
                        name: Jane Doe
                        email: jane@example.com
                    success: true
        "400":
          description: No org
          content:
            application/json:
              examples:
                No_org:
                  summary: No org
                  value:
                    success: false
                    message: Organization ID not found
        "401":
          description: Unauthorized
          content:
            application/json:
              examples:
                Unauthorized:
                  summary: Unauthorized
                  value:
                    message: unauthorized user
      x-docstar-published: true
  /organization:
    post:
      summary: Create Organization
      description: |-
        Creates a new organisation (company) in MSG91 on behalf of the caller using their proxy_auth_token, then provisions its billing (Lago customer, subscription and wallet). If MSG91 creation fails nothing is created (401/403 passed through, otherwise 502). If billing provisioning fails the org still exists and 201 is returned with billing.provisioned=false. 400 if proxy_auth_token is missing.

        Accepted auth: Authorization (dashboard user JWT) OR pauthkey (org auth key) OR proxy_auth_token (proxy / auth 2.0 user token).

        Body fields:
        - company: object, required, MSG91 company payload passed through as-is
        - company.name: string, required, organisation name
        - company.(other): any other MSG91 company fields, passed through untouched
      parameters:
        - name: Authorization
          in: header
          required: false
          description: GTWY dashboard user JWT (the token GTWY issues at login, signed with the server SecretKey). Raw token, no 'Bearer' prefix.
          schema:
            type: string
        - name: pauthkey
          in: header
          required: false
          description: GTWY org auth key (pauthkey / pauthtoken) created in GTWY > API keys. Identifies the org; carries no user role.
          schema:
            type: string
        - name: proxy_auth_token
          in: header
          required: false
          description: Proxy (36Blocks / MSG91) user token, e.g. returned by the proxy auth 2.0 widget. Resolved via routes.msg91.com/api/c/getDetails; carries no user role or email.
          schema:
            type: string
        - name: Content-Type
          in: header
          required: false
          description: ""
          schema:
            type: string
          example: application/json
      requestBody:
        content:
          application/json:
            schema:
              type: object
            example:
              company:
                name: Acme Inc
      responses:
        "201":
          description: Created
          content:
            application/json:
              examples:
                Created:
                  summary: Created
                  value:
                    success: true
                    message: organisation created and provisioned
                    data:
                      org_id: "67890"
                      organization:
                        id: 67890
                        name: Acme Inc
                      billing:
                        provisioned: true
                        plan: free
                        wallet_created: true
                        subscription_created: true
                Created_billing_failed:
                  summary: Created, billing failed
                  value:
                    success: true
                    message: organisation created, but billing provisioning failed — retry with /api/lago/provision/admin
                    data:
                      org_id: "67890"
                      organization: {}
                      billing:
                        provisioned: false
                        error: "..."
        "400":
          description: Missing proxy token
          content:
            application/json:
              examples:
                Missing_proxy_token:
                  summary: Missing proxy token
                  value:
                    success: false
                    message: proxy_auth_token header is required to create an organisation
                Validation_error:
                  summary: Validation error
                  value:
                    message: company.name is required
                    data: {}
        "502":
          description: Upstream failure
          content:
            application/json:
              examples:
                Upstream_failure:
                  summary: Upstream failure
                  value:
                    success: false
                    message: could not create the organisation
        "401":
          description: Unauthorized
          content:
            application/json:
              examples:
                Unauthorized:
                  summary: Unauthorized
                  value:
                    message: unauthorized user
      x-docstar-published: true
