          required: false
          description: string, optional; 'bridge' or 'version' - what kind of id version_id is
          schema:
            type: string
          example: version
        - name: Authorization
          in: header
          required: false
          description: GTWY dashboard user JWT (the token GTWY issues at login, signed with the server SecretKey). Raw token, no 'Bearer' prefix.
