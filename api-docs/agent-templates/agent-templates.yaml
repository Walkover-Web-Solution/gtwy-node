openapi: 3.0.3
info:
  title: Agent Templates
  version: 1.0.0
servers:
  - url: https://db.gtwy.ai/api
paths:
  /template:
    get:
      summary: List Agent Templates
      description: |-
        Returns all visible agent templates. Each template's `template` field is a JSON string of the filtered agent configuration (including child_agents); `meta` holds marketing copy (headline, description, useCases) when available.

        Accepted auth: none (public).
      responses:
        "200":
          description: Success
          content:
            application/json:
              examples:
                Success:
                  summary: Success
                  value:
                    success: true
                    result:
                      - _id: 6650f1c2a1b2c3d4e5f60801
                        template: '{"name":"Support Bot","service":"openai",...}'
                        templateName: Customer Support
                        visible: true
                        meta:
                          headline: "..."
                          description: "..."
                          useCases: []
                        created_at: "2025-01-01T00:00:00.000Z"
                        updated_at: "2025-01-01T00:00:00.000Z"
      x-docstar-published: true
  /template/create/agent/{template_id}:
    post:
      summary: Create Agent From Template
      description: |-
        Creates a new agent in the caller's org (and embed folder, for embed users) from a template, with a unique name, a first published version, cloned tool functions, copied knowledge-base resources, remapped tool_choice, and recursively created child agents. Returns the created agent with tools. 404 if the template does not exist; any other failure returns 400 with {success:false,message:'Error creating agent from template: ...'}.

        Accepted auth: Authorization (dashboard user JWT) OR Authorization (GTWY embed JWT) + pauthkey.

        Write access check (requireAdminRole): admins always pass; on routes with an agent/version id in the path, editors/viewers must be in the agent's users list. Only the dashboard JWT carries a role - pauthkey and proxy_auth_token callers get 403 on those id routes.

        Body fields:
        - bridgeType: string, optional (not validated), agent type to use when the template has none: api | chatbot; default api
        - meta: object, optional (not validated), stored as the new agent's meta
      parameters:
        - name: template_id
          in: path
          required: true
          description: 24-char hex ObjectId of the template, from List Agent Templates
          schema:
            type: string
        - name: Authorization
          in: header
          required: false
          description: "Accepts any ONE of: (1) GTWY dashboard user JWT (the token GTWY issues at login, signed with the server SecretKey). Raw token, no 'Bearer' prefix. | (2) GTWY embed JWT signed with the org's gtwyAccessToken (payload org_id, folder_id, user_id) - must be sent together with the org's pauthkey header."
          schema:
            type: string
        - name: Content-Type
          in: header
          required: false
          description: ""
          schema:
            type: string
          example: application/json
      requestBody:
        content:
          application/json:
            schema:
              type: object
            example:
              bridgeType: api
              meta:
                source: template_gallery
      responses:
        "200":
          description: Success
          content:
            application/json:
              examples:
                Success:
                  summary: Success
                  value:
                    success: true
                    message: Agent created from template successfully
                    agent:
                      _id: 6650f1c2a1b2c3d4e5f60789
                      name: Customer Support
                      service: openai
                      configuration: {}
                      published_version_id: 6650f1c2a1b2c3d4e5f60790
        "404":
          description: Template not found
          content:
            application/json:
              examples:
                Template_not_found:
                  summary: Template not found
                  value:
                    success: false
                    message: Template not found
        "403":
          description: Forbidden
          content:
            application/json:
              examples:
                Forbidden:
                  summary: Forbidden
                  value:
                    success: false
                    message: You don't have access to update this agent
        "400":
          description: Validation error
          content:
            application/json:
              examples:
                Validation_error:
                  summary: Validation error
                  value:
                    message: template_id must be a valid MongoDB ObjectId
                    data: {}
        "401":
          description: Unauthorized
          content:
            application/json:
              examples:
                Unauthorized:
                  summary: Unauthorized
                  value:
                    message: unauthorized user
      x-docstar-published: true
  /template/{agent_id}:
    post:
      summary: Create Template From Agent
      description: |-
        Publishes an existing agent as a public template named `templateName`. The agent config (secrets, usage, ids and timestamps stripped), its function names and nested connected agents are serialised. For non-embed users with an email, the template is first checked by GTWY's template_validator agent; if it rejects, 400. Note: the agent is looked up by id without an org check. Missing templateName or unknown agent returns 400 with {message}.

        Accepted auth: Authorization (dashboard user JWT) OR Authorization (GTWY embed JWT) + pauthkey.

        Body fields:
        - templateName: string, required (checked in controller), display name of the template
      parameters:
        - name: agent_id
          in: path
          required: true
          description: agent (bridge) id to convert, from List Agents
          schema:
            type: string
        - name: Authorization
          in: header
          required: false
          description: "Accepts any ONE of: (1) GTWY dashboard user JWT (the token GTWY issues at login, signed with the server SecretKey). Raw token, no 'Bearer' prefix. | (2) GTWY embed JWT signed with the org's gtwyAccessToken (payload org_id, folder_id, user_id) - must be sent together with the org's pauthkey header."
          schema:
            type: string
        - name: Content-Type
          in: header
          required: false
          description: ""
          schema:
            type: string
          example: application/json
      requestBody:
        content:
          application/json:
            schema:
              type: object
            example:
              templateName: Customer Support
      responses:
        "200":
          description: Success
          content:
            application/json:
              examples:
                Success:
                  summary: Success
                  value:
                    success: true
                    result:
                      _id: 6650f1c2a1b2c3d4e5f60801
                      template: "{...}"
                      templateName: Customer Support
                      visible: true
                      meta: {}
        "400":
          description: Validator rejected
          content:
            application/json:
              examples:
                Validator_rejected:
                  summary: Validator rejected
                  value:
                    success: false
                    message: Failed to convert agent to template.
                Missing_name_agent:
                  summary: Missing name / agent
                  value:
                    message: templateName is required
                    data: {}
        "401":
          description: Unauthorized
          content:
            application/json:
              examples:
                Unauthorized:
                  summary: Unauthorized
                  value:
                    message: unauthorized user
      x-docstar-published: true
