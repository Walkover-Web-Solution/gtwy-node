openapi: 3.0.3
info:
  title: Rich UI Templates
  version: 1.0.0
servers:
  - url: https://db.gtwy.ai/api
paths:
  /rich_ui_templates:
    post:
      summary: Create Rich UI Template
      description: |-
        Creates a rich UI template (a UI component tree with {{variable}} placeholders that agents can render) in the caller's org. If `json_schema` is omitted it is generated from template_format and the variables. If `ui` is sent without template_format, ui is used as template_format. Errors are returned as 400 {message:'Failed to create template: ...'}.

        Accepted auth: Authorization (dashboard user JWT) OR pauthkey (org auth key) OR proxy_auth_token (proxy / auth 2.0 user token).

        Body fields:
        - name: string, required
        - description: string, optional, may be empty
        - template_format: object, required by validation, the component tree
        - json_schema: object, optional, schema of the variables; auto-generated when absent
        - ui: object, optional, stored as ui
        - variables: object, optional, default/sample variable values (default_json or default_values are accepted as aliases)
        - is_public: boolean, optional, default false; public templates are visible to all orgs
      parameters:
        - name: Authorization
          in: header
          required: false
          description: GTWY dashboard user JWT (the token GTWY issues at login, signed with the server SecretKey). Raw token, no 'Bearer' prefix.
          schema:
            type: string
        - name: pauthkey
          in: header
          required: false
          description: GTWY org auth key (pauthkey / pauthtoken) created in GTWY > API keys. Identifies the org; carries no user role.
          schema:
            type: string
        - name: proxy_auth_token
          in: header
          required: false
          description: Proxy (36Blocks / MSG91) user token, e.g. returned by the proxy auth 2.0 widget. Resolved via routes.msg91.com/api/c/getDetails; carries no user role or email.
          schema:
            type: string
        - name: Content-Type
          in: header
          required: false
          description: ""
          schema:
            type: string
          example: application/json
      requestBody:
        content:
          application/json:
            schema:
              type: object
            example:
              name: Flight card
              description: Shows a flight
              template_format:
                type: Card
                children:
                  - type: Text
                    value: "{{flight_no}}"
              variables:
                flight_no: AI101
              is_public: false
      responses:
        "201":
          description: Created
          content:
            application/json:
              examples:
                Created:
                  summary: Created
                  value:
                    success: true
                    data:
                      _id: 6650f1c2a1b2c3d4e5f60a01
                      name: Flight card
                      description: Shows a flight
                      json_schema:
                        type: object
                        properties: {}
                      template_format:
                        type: Card
                        children:
                          - type: Text
                            value: "{{flight_no}}"
                      ui: null
                      variables:
                        flight_no: AI101
                      created_by: "101"
                      updated_by: "101"
                      org_id: "12345"
                      is_public: false
                      createdAt: "2025-01-01T00:00:00.000Z"
                      updatedAt: "2025-01-01T00:00:00.000Z"
                    message: Rich UI template created successfully
        "400":
          description: Validation error
          content:
            application/json:
              examples:
                Validation_error:
                  summary: Validation error
                  value:
                    message: Template format is required
                    data: {}
        "401":
          description: Unauthorized
          content:
            application/json:
              examples:
                Unauthorized:
                  summary: Unauthorized
                  value:
                    message: unauthorized user
      x-docstar-published: true
    get:
      summary: List Rich UI Templates
      description: |-
        Lists rich UI templates visible to the caller: all of the org's templates plus all public templates from any org, newest first.

        Accepted auth: Authorization (dashboard user JWT) OR pauthkey (org auth key) OR proxy_auth_token (proxy / auth 2.0 user token).
      parameters:
        - name: Authorization
          in: header
          required: false
          description: GTWY dashboard user JWT (the token GTWY issues at login, signed with the server SecretKey). Raw token, no 'Bearer' prefix.
          schema:
            type: string
        - name: pauthkey
          in: header
          required: false
          description: GTWY org auth key (pauthkey / pauthtoken) created in GTWY > API keys. Identifies the org; carries no user role.
          schema:
            type: string
        - name: proxy_auth_token
          in: header
          required: false
          description: Proxy (36Blocks / MSG91) user token, e.g. returned by the proxy auth 2.0 widget. Resolved via routes.msg91.com/api/c/getDetails; carries no user role or email.
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              examples:
                Success:
                  summary: Success
                  value:
                    success: true
                    data:
                      - _id: 6650f1c2a1b2c3d4e5f60a01
                        name: Flight card
                        description: Shows a flight
                        json_schema:
                          type: object
                          properties: {}
                        template_format:
                          type: Card
                          children:
                            - type: Text
                              value: "{{flight_no}}"
                        ui: null
                        variables:
                          flight_no: AI101
                        created_by: "101"
                        updated_by: "101"
                        org_id: "12345"
                        is_public: false
                        createdAt: "2025-01-01T00:00:00.000Z"
                        updatedAt: "2025-01-01T00:00:00.000Z"
                    count: 1
        "401":
          description: Unauthorized
          content:
            application/json:
              examples:
                Unauthorized:
                  summary: Unauthorized
                  value:
                    message: unauthorized user
      x-docstar-published: true
  /rich_ui_templates/{template_id}:
    put:
      summary: Update Rich UI Template
      description: |-
        Updates a rich UI template. Only name, description, json_schema, template_format, ui, variables and is_public are applied. If template_format changes without json_schema, the schema is regenerated. Note: is_public is reset to false unless sent as true on every update, and the lookup is by id only (no org check in code). Not found or other errors return 400 {message:'Failed to update template: ...'}.

        Accepted auth: Authorization (dashboard user JWT) OR pauthkey (org auth key) OR proxy_auth_token (proxy / auth 2.0 user token).

        Body fields:
        - name: string, optional
        - description: string, optional
        - json_schema: object, optional
        - template_format: object, optional
        - ui: object, optional
        - variables: object, optional
        - is_public: boolean, optional; omitted means false
      parameters:
        - name: template_id
          in: path
          required: true
          description: rich UI template id, from List Rich UI Templates
          schema:
            type: string
        - name: Authorization
          in: header
          required: false
          description: GTWY dashboard user JWT (the token GTWY issues at login, signed with the server SecretKey). Raw token, no 'Bearer' prefix.
          schema:
            type: string
        - name: pauthkey
          in: header
          required: false
          description: GTWY org auth key (pauthkey / pauthtoken) created in GTWY > API keys. Identifies the org; carries no user role.
          schema:
            type: string
        - name: proxy_auth_token
          in: header
          required: false
          description: Proxy (36Blocks / MSG91) user token, e.g. returned by the proxy auth 2.0 widget. Resolved via routes.msg91.com/api/c/getDetails; carries no user role or email.
          schema:
            type: string
        - name: Content-Type
          in: header
          required: false
          description: ""
          schema:
            type: string
          example: application/json
      requestBody:
        content:
          application/json:
            schema:
              type: object
            example:
              name: Flight card v2
              is_public: false
      responses:
        "200":
          description: Success
          content:
            application/json:
              examples:
                Success:
                  summary: Success
                  value:
                    success: true
                    data:
                      _id: 6650f1c2a1b2c3d4e5f60a01
                      name: Flight card v2
                      description: Shows a flight
                      json_schema:
                        type: object
                        properties: {}
                      template_format:
                        type: Card
                        children:
                          - type: Text
                            value: "{{flight_no}}"
                      ui: null
                      variables:
                        flight_no: AI101
                      created_by: "101"
                      updated_by: "101"
                      org_id: "12345"
                      is_public: false
                      createdAt: "2025-01-01T00:00:00.000Z"
                      updatedAt: "2025-01-01T00:00:00.000Z"
                    message: Template updated successfully
        "400":
          description: Not found
          content:
            application/json:
              examples:
                Not_found:
                  summary: Not found
                  value:
                    message: "Failed to update template: Template not found"
                    data: {}
                Validation_error:
                  summary: Validation error
                  value:
                    message: At least one field must be provided for update
                    data: {}
        "401":
          description: Unauthorized
          content:
            application/json:
              examples:
                Unauthorized:
                  summary: Unauthorized
                  value:
                    message: unauthorized user
      x-docstar-published: true
    delete:
      summary: Delete Rich UI Template
      description: |-
        Permanently deletes a rich UI template (the route comment says soft delete, but the code hard-deletes). Lookup is by id only (no org check in code). Not found returns 400 {message:'Failed to delete template: Template not found'}.

        Accepted auth: Authorization (dashboard user JWT) OR pauthkey (org auth key) OR proxy_auth_token (proxy / auth 2.0 user token).
      parameters:
        - name: template_id
          in: path
          required: true
          description: rich UI template id, from List Rich UI Templates
          schema:
            type: string
        - name: Authorization
          in: header
          required: false
          description: GTWY dashboard user JWT (the token GTWY issues at login, signed with the server SecretKey). Raw token, no 'Bearer' prefix.
          schema:
            type: string
        - name: pauthkey
          in: header
          required: false
          description: GTWY org auth key (pauthkey / pauthtoken) created in GTWY > API keys. Identifies the org; carries no user role.
          schema:
            type: string
        - name: proxy_auth_token
          in: header
          required: false
          description: Proxy (36Blocks / MSG91) user token, e.g. returned by the proxy auth 2.0 widget. Resolved via routes.msg91.com/api/c/getDetails; carries no user role or email.
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              examples:
                Success:
                  summary: Success
                  value:
                    success: true
                    message: Template deleted successfully
        "400":
          description: Not found
          content:
            application/json:
              examples:
                Not_found:
                  summary: Not found
                  value:
                    message: "Failed to delete template: Template not found"
                    data: {}
        "401":
          description: Unauthorized
          content:
            application/json:
              examples:
                Unauthorized:
                  summary: Unauthorized
                  value:
                    message: unauthorized user
      x-docstar-published: true
