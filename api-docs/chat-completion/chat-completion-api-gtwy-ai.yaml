  /api/v2/model/rerun:
    post:
      summary: Rerun Messages
      description: |-
        Re-runs earlier conversation messages against the agent's current configuration. Either pass message_ids (each logged message is re-queued) or thread_id + sub_thread_id (the most recent message in that thread is re-queued with the last few conversations as history). Work is asynchronous: each rerun is pushed to the queue and results are saved to history / delivered through the agent's configured channel. Errors: 400 if neither message_ids nor thread_id+sub_thread_id is provided, or the agent/model cannot be resolved; 404 if no matching conversation is found; 500 on unexpected errors.

        Accepted auth: Authorization (dashboard user JWT) OR proxy_auth_token (proxy / auth 2.0 user token) OR pauthkey (org auth key).

        Body fields:
        - agent_id: string, required (alias bridge_id). Agent whose current config is used.
        - bridge_id: string, alias of agent_id.
        - message_ids: array of strings, required unless thread_id+sub_thread_id are given. Message ids from conversation history.
        - thread_id: string, optional. With sub_thread_id (and no message_ids) reruns the last message of that thread.
        - sub_thread_id: string, optional. Required together with thread_id for thread mode.
        - version_id: string, optional. Version whose configuration should be used.
      parameters:
        - name: Authorization
          in: header
          required: false
          description: GTWY dashboard user JWT (the token GTWY issues at login, signed with the server SecretKey). Raw token, no 'Bearer' prefix.
          schema:
            type: string
        - name: proxy_auth_token
          in: header
          required: false
          description: Proxy (36Blocks / MSG91) user token, e.g. returned by the proxy auth 2.0 widget. Resolved via routes.msg91.com/api/c/getDetails; carries no user role or email.
          schema:
            type: string
        - name: pauthkey
          in: header
          required: false
          description: GTWY org auth key (pauthkey / pauthtoken) created in GTWY > API keys. Identifies the org; carries no user role.
          schema:
            type: string
        - name: Content-Type
          in: header
          required: false
          description: ""
          schema:
            type: string
          example: application/json
      requestBody:
        content:
          application/json:
            schema:
              type: object
            example:
              agent_id: 6650a1b2c3d4e5f6a7b8c9d0
              message_ids:
                - 7f9c2a10-6f1e-11f0-9a2b-0242ac120002
      responses:
        "200":
          description: Queued
          content:
            application/json:
              examples:
                Queued:
                  summary: Queued
                  value:
                    success: true
                    message: 1 message(s) queued for rerun.
                    queued:
                      - 7f9c2a10-6f1e-11f0-9a2b-0242ac120002
                    not_found: []
        "400":
          description: Missing identifiers
          content:
            application/json:
              examples:
                Missing_identifiers:
                  summary: Missing identifiers
                  value:
                    detail:
                      success: false
                      error: Provide either message_ids array or both thread_id and sub_thread_id
        "404":
          description: Nothing found
          content:
            application/json:
              examples:
                Nothing_found:
                  summary: Nothing found
                  value:
                    detail:
                      success: false
                      error: No conversation found for the given parameters
                No_auth_header_sent:
                  summary: No auth header sent
                  value:
                    detail: unauthorized user
        "429":
          description: Rate limited
          content:
            application/json:
              examples:
                Rate_limited:
                  summary: Rate limited
                  value:
                    detail: Too many requests for 6650a1b2c3d4e5f6a7b8c9d0
        "401":
          description: Unauthorized (bad/revoked token or invalid pauthkey)
          content:
            application/json:
              examples:
                Unauthorized_bad_revoked_token_or_invalid_pauthkey:
                  summary: Unauthorized (bad/revoked token or invalid pauthkey)
                  value:
                    detail: unauthorized user
        "403":
          description: Organization disabled
          content:
            application/json:
              examples:
                Organization_disabled:
                  summary: Organization disabled
                  value:
                    detail: Organization is disabled
